name: Tests règles Firestore
on:
  workflow_dispatch:
  push:
    branches: [security-v2-tests]
    paths: ['firestore.rules','test/**','package.json','.github/workflows/rules-test.yml']
permissions:
  contents: write
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests sur l'émulateur Firestore officiel (compile aussi les règles)
        run: |
          mkdir -p results
          set +e
          npx firebase emulators:exec --only firestore --project demo-tradart \
            "node --test --test-reporter=spec test/" > results/test-output.txt 2>&1
          echo $? > results/exit-code.txt
          { echo "date: $(date -u +%FT%TZ)"; echo "node: $(node -v)"; echo "firebase-tools: $(npx firebase --version)";
            echo "rules-sha256: $(sha256sum firestore.rules | cut -d' ' -f1)"; } > results/meta.txt
          tail -n 300 firestore-debug.log > results/firestore-debug-tail.txt 2>/dev/null || true
          tail -80 results/test-output.txt
      - name: Publier les résultats sur la branche
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results; git commit -m "Résultats des tests (CI)" || true; git push || true
      - name: Échec si un test est rouge
        run: test "$(cat results/exit-code.txt)" = "0"
